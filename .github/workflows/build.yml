# Builds a binary for every platform the game ships on and leaves each one in
# an artifact.
#
# Nothing triggers this on its own. `release.yml` and `nightly.yml` both call
# it, so the two publish the same binaries built the same way, and the nightly
# run exercises the release build every night.
#
# `version` is what the binary must report. The compiler reads it out of
# shard.yml through the VERSION macro, and a step here runs the binary and
# compares, so a mismatch stops the build rather than reaching a release.
#
# `archive-stem` names the tarballs. The platform and the extension are added
# to it: a stem of `crystal-roguelike-0.1.0` gives
# `crystal-roguelike-0.1.0-linux-x86_64.tar.gz`. The nightly passes a stem
# with no version in it, so its download links stay the same from night to
# night.
name: build

on:
  workflow_call:
    inputs:
      version:
        description: The version the binary must report
        required: true
        type: string
      archive-stem:
        description: The leading part of each tarball's name
        required: true
        type: string

permissions:
  contents: read

env:
  CRYSTAL_VERSION: '1.21.0'

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds run in the Crystal project's Alpine image and link
          # statically, so one binary runs on any distribution. The build runs
          # under docker rather than in a job container: the checkout and the
          # artifact upload then run on the host, where they have the glibc
          # they are built against.
          - platform: linux-x86_64
            runner: ubuntu-24.04
            builder: docker
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            builder: docker
          # macOS cannot link libSystem statically. The two libraries that are
          # not part of the OS are linked from their archives instead, which
          # leaves a binary that needs nothing from Homebrew.
          - platform: macos-aarch64
            runner: macos-15
            builder: native

    env:
      VERSION: ${{ inputs.version }}
      STEM: ${{ inputs.archive-stem }}
      PLATFORM: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Build in the Alpine image, statically linked
        if: matrix.builder == 'docker'
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "crystallang/crystal:${CRYSTAL_VERSION}-alpine" \
            sh -euxc '
              git config --global --add safe.directory /workspace
              shards install --production --frozen
              mkdir -p build
              crystal build --release --no-debug --static \
                -o build/crystal-roguelike src/main.cr

              # --no-debug covers what the compiler emits. The musl and libgc
              # objects linked in bring their own, about a megabyte of it.
              strip build/crystal-roguelike
            '

      - uses: crystal-lang/install-crystal@v1
        if: matrix.builder == 'native'
        with:
          crystal: ${{ env.CRYSTAL_VERSION }}

      - name: Build for macOS, linking the collector and pcre2 from their archives
        if: matrix.builder == 'native'
        run: |
          set -euo pipefail
          # Crystal itself pulls these in when Homebrew installs it. The
          # action may install Crystal from a tarball instead, so ask for
          # them by name, and only when they are not already here.
          for formula in bdw-gc pcre2; do
            brew list "$formula" > /dev/null 2>&1 || brew install "$formula"
          done

          # The linker takes the first directory that holds a match. A
          # directory holding only the archives is searched first, so the
          # dylibs beside them in Homebrew are never reached.
          mkdir -p .static-libs
          cp "$(brew --prefix bdw-gc)/lib/libgc.a" .static-libs/
          cp "$(brew --prefix pcre2)/lib/libpcre2-8.a" .static-libs/

          shards install --production --frozen

          # The linker writes the output file. It does not make the directory
          # it goes in.
          mkdir -p build
          crystal build --release --no-debug \
            -o build/crystal-roguelike src/main.cr \
            --link-flags "-L$PWD/.static-libs"

          otool -L build/crystal-roguelike

      # Every runner is the architecture it built for, so the binary can be
      # run here. It reports the version it was compiled with, which is the
      # last place a mismatch could still appear.
      - name: Run it and check what it says it is
        run: |
          set -euo pipefail
          said=$(./build/crystal-roguelike --version)
          want="crystal-roguelike $VERSION"

          if [ "$said" != "$want" ]; then
            echo "::error::the binary says '$said', the build is '$want'"
            exit 1
          fi

          echo "$said"

      - name: Pack it with the licence and the readme
        run: |
          set -euo pipefail
          name="$STEM-$PLATFORM"

          mkdir -p "dist/$name"
          cp build/crystal-roguelike "dist/$name/"
          cp README.md LICENSE "dist/$name/"

          tar --create --gzip --directory dist --file "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"

          if command -v sha256sum > /dev/null; then
            (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          fi

          cat "dist/$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
