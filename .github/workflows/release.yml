# Builds the binaries for a tagged version and attaches them to a GitHub
# release.
#
# A tag of the form vX.Y.Z releases. Anything else run by hand builds the same
# binaries and stops there, so the build can be exercised without cutting a
# tag.
#
# The build itself lives in `build.yml`, which the nightly calls as well.
#
# The version a binary reports comes from shard.yml, which the compiler reads
# through the VERSION macro. The first job refuses a tag that says something
# else, so a release named v1.2.3 cannot contain a binary that calls itself
# 1.2.2.
name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Settles what version is being built before anything spends a runner on it.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.settle.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: settle
        name: Read shard.yml and check it against the tag
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: *//p' shard.yml | head -1 | tr -d "\"' ")

          if [ -z "$version" ]; then
            echo "::error file=shard.yml::no version in shard.yml"
            exit 1
          fi

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tagged="${GITHUB_REF_NAME#v}"
            if [ "$tagged" != "$version" ]; then
              echo "::error file=shard.yml::tag $GITHUB_REF_NAME wants version $tagged, shard.yml says $version"
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "building $version"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      archive-stem: crystal-roguelike-${{ needs.version.outputs.version }}

  release:
    if: github.ref_type == 'tag'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      # The per-platform files are already in sha256sum's own format, so the
      # concatenation is a file `sha256sum --check` reads.
      - name: Gather the checksums
        run: |
          set -euo pipefail
          cd dist
          cat ./*.tar.gz.sha256 > SHA256SUMS
          rm -f ./*.tar.gz.sha256
          sha256sum --check SHA256SUMS
          ls -l

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
