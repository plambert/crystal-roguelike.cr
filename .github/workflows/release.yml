# Builds the binaries for a tagged version and attaches them to a GitHub
# release.
#
# A tag of the form vX.Y.Z releases. Anything else run by hand builds the same
# binaries and stops there, so the build can be exercised without cutting a
# tag.
#
# The build itself lives in `build.yml`. It makes a regular tarball and a test
# build tarball for each platform, and the release attaches all of them.
#
# The version a binary reports comes from shard.yml, which the compiler reads
# through the VERSION macro. The first job refuses a tag that says something
# else, so a release named v1.2.3 cannot contain a binary that calls itself
# 1.2.2. It also refuses a tag whose version has no entry in CHANGELOG.md,
# because that entry becomes the body of the release.
name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Settles what version is being built before anything spends a runner on it.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.settle.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: settle
        name: Read shard.yml and check it against the tag
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: *//p' shard.yml | head -1 | tr -d "\"' ")

          if [ -z "$version" ]; then
            echo "::error file=shard.yml::no version in shard.yml"
            exit 1
          fi

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tagged="${GITHUB_REF_NAME#v}"
            if [ "$tagged" != "$version" ]; then
              echo "::error file=shard.yml::tag $GITHUB_REF_NAME wants version $tagged, shard.yml says $version"
              exit 1
            fi
            if ! grep -qF "## [$version]" CHANGELOG.md; then
              echo "::error file=CHANGELOG.md::no entry for $version in CHANGELOG.md"
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "building $version"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      archive-stem: crystal-roguelike-${{ needs.version.outputs.version }}

  release:
    if: github.ref_type == 'tag'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The whole history, so the previous release tag can be found.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      # The per-platform files are already in sha256sum's own format, so the
      # concatenation is a file `sha256sum --check` reads. It lists the test
      # build tarballs beside the regular ones.
      - name: Gather the checksums
        run: |
          set -euo pipefail
          cd dist
          cat ./*.sha256 > SHA256SUMS
          rm -f ./*.sha256
          sha256sum --check SHA256SUMS
          ls -l

      # The body is the version's entry in CHANGELOG.md followed by one link to
      # the commits since the previous release. The workflow writes the whole
      # body itself. GitHub's generated notes are appended to whatever body the
      # release already has, so a second run for the same tag repeated the link.
      - name: Write the release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail

          awk -v version="$VERSION" '
            /^## \[/ { inside = index($0, "## [" version "]") == 1; next }
            inside { lines[n++] = $0 }
            END {
              while (n > 0 && lines[n - 1] == "") n--
              start = 0
              while (start < n && lines[start] == "") start++
              for (i = start; i < n; i++) print lines[i]
            }
          ' CHANGELOG.md > notes.md

          if [ ! -s notes.md ]; then
            echo "::error file=CHANGELOG.md::the entry for $VERSION is empty"
            exit 1
          fi

          previous=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
                       | awk -v tag="$GITHUB_REF_NAME" 'seen { print; exit } $0 == tag { seen = 1 }')

          {
            echo
            if [ -n "$previous" ]; then
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_REF_NAME"
            else
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME"
            fi
          } >> notes.md

          cat notes.md

      - id: publish
        uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true

      # The embed carries the same notes.md the release got, with each wrapped
      # paragraph joined onto one line, because Discord shows every line break.
      # Discord allows 4096 characters in a description and 6000 in the whole
      # embed, so a long entry is cut at a line break and the compare link goes
      # back on after the cut. A fork has no DISCORD_WEBHOOK secret and skips
      # the step, and a Discord failure never fails the release.
      - name: Announce the release on Discord
        if: success()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_URL: ${{ steps.publish.outputs.url }}
        run: |
          set -euo pipefail

          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "::notice::DISCORD_WEBHOOK is not set, so the release is not announced"
            exit 0
          fi

          awk '
            function flush() { if (held != "") print held; held = "" }
            /^[[:space:]]*$/ { flush(); print; next }
            /^[[:space:]]*([*-] |#)/ { flush(); held = $0; next }
            { sub(/^[[:space:]]+/, ""); held = (held == "" ? $0 : held " " $0) }
            END { flush() }
          ' notes.md > announcement.md

          jq -n \
            --rawfile notes announcement.md \
            --arg title "crystal-roguelike $VERSION" \
            --arg url "$RELEASE_URL" \
            --arg footer "$GITHUB_REPOSITORY $GITHUB_REF_NAME" \
            '
              def rstrip: sub("\\s+$"; "");

              ($notes | rstrip | split("\n") | map(select(startswith("## [") | not))) as $lines
              | (if ($lines | length) > 0 and ($lines[-1] | startswith("**Full Changelog**"))
                 then {body: ($lines[:-1] | join("\n") | rstrip), link: ("\n\n" + $lines[-1])}
                 else {body: ($lines | join("\n") | rstrip), link: ""}
                 end) as $parts
              | "\n\nThe rest is on the release page." as $tail
              | ([4096, 6000 - ($title | length) - ($footer | length)] | min) as $limit
              | ($limit - ($parts.link | length)) as $room
              | ($parts.body
                 | if length <= $room then .
                   else .[:($room - ($tail | length))]
                        | (if rindex("\n") then .[:rindex("\n")] else . end)
                        | rstrip + $tail
                   end) as $body
              | {
                  username: "RoguelikeReleaseBot",
                  embeds: [{
                    title: $title,
                    url: $url,
                    description: ($body + $parts.link),
                    color: 7109257,
                    footer: {text: $footer}
                  }]
                }
            ' > discord.json

          status=$(curl -sS -o discord-response.txt -w '%{http_code}' \
                     -H 'Content-Type: application/json' \
                     --data @discord.json "$DISCORD_WEBHOOK")
          echo "Discord answered HTTP $status"

          case "$status" in
            2??) ;;
            *) cat discord-response.txt; echo; exit 1 ;;
          esac
